[project]
name = "visionx"
version = "0.1.0"
description = "VisionX: asistencia espacial por voz con cámara estéreo y fusión de profundidad (TPF I308, UdeSA)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",  # contrib: aruco/ChArUco y ximgproc (filtro WLS)
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Redes: Depth Anything V2, U-Net de Fusion. En la Mac corre con MPS.
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
]
# Detección y segmentación (T06): YOLO-seg y ByteTrack de Ultralytics. Licencia AGPL-3.0.
# Trae torch; en Windows sin NVIDIA corre en CPU. Los pesos se descargan aparte, nunca en tests.
deteccion = [
    "ultralytics>=8.4",
    "lap>=0.5.12",  # asignación lineal de ByteTrack; Ultralytics lo instalaría solo en tiempo de uso
]
# Voz (T08): micrófono/parlantes (sounddevice, MIT), STT local (faster-whisper, MIT; CPU en
# Windows y Mac) y TTS local (Piper, GPL-3.0). Modelos y voces se bajan aparte, nunca en tests.
voz = [
    "sounddevice>=0.5",
    "faster-whisper>=1.2",
    "piper-tts>=1.8",
]

[project.scripts]
visionx = "visionx.cli:main"

[tool.uv]
# Ultralytics pide opencv-python, pero el proyecto usa opencv-contrib-python (ArUco/ChArUco y
# WLS de ximgproc). Ambos instalan el mismo módulo cv2 y uno pisaría al otro: se excluye
# opencv-python con un marcador que nunca se cumple. contrib ya provee todo lo que usa YOLO.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visionx"]

# Empaquetar el mismo default del checkout, sin mantener una segunda copia manual.
[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "visionx/default.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"
