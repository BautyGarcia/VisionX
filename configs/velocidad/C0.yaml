# C0 — Base actual: YOLO en CPU a 960 px, CREStereo continuo con 4 iteraciones (docs/VELOCIDAD.md).
# Se superpone a la config local de la máquina (cámara, audio): no editar local.yaml por prueba.
incluir: configs/local.yaml
detection:
  device: cpu
  imgsz: 960
depth:
  precisa:
    espera_s: 3.0          # el preciso en vivo tarda ~1,6 s con todo corriendo (19/11)
  crestereo:
    continuo:
      iters: 4
