# Configuración por defecto de VisionX. Los valores se cambian acá, no en el código.

artifacts:
  root: null                # carpeta local de VisionX-artefactos (Drive); cada uno la pisa en configs/local.yaml

camera:
  device: 0                 # índice de la ELP en OpenCV (cada uno lo pisa en configs/local.yaml)
  backend: auto             # auto | avfoundation (macOS) | dshow | msmf (Windows) | v4l2 (Linux)
  capture: [3840, 1080]     # par lado a lado, MJPEG
  fourcc: MJPG
  fps: 30                   # pedido al driver; la ELP entrega ~60 y CAP_PROP_FPS informa 5: medir
  swap_eyes: false          # true solo si `python -m visionx.camera ver` muestra los ojos invertidos
  reconnect_attempts: 3     # reaperturas antes de declarar la cámara perdida (SourceError)
  warmup_frames: 5          # cuadros descartados al abrir
  calibration: configs/calib/elp-2026-11-11-corregida.yaml  # s6 + corrección de disparidad, BITACORA 2026-11-13

depth:
  compute: [1280, 720]      # resolución por ojo para profundidad
  precisa:
    estimador: ninguna     # --profundidad-precisa: B0–B5, fusion, crestereo-preciso o depth.estimadores
    espera_s: 2.0          # margen sobre B4 CPU ~1,1 s; limitada por la vigencia de la orden
    compute: null          # null hereda depth.compute; override solo para la precisa, [ancho, alto]
  estimadores: {}           # nombre: {fabrica: "paquete.modulo:funcion", parámetros libres...}
  range_m: [0.5, 3.0]       # rango donde se anuncian metros
  min_coverage: 0.0         # bajo esto el DepthResult sale PARTIAL; se fija con el banco ELP
  # SGBM y filtros de B0-B2 (src/visionx/depth/stereo.py). CONGELADOS el 14/11 con InStereo2K
  # val (`python -m visionx.depth ajustar`, ronda 2, commit c9904e8; BITACORA 2026-11-14).
  sgbm:
    num_disparities: 96     # ELP a 1280x720 (fx ~404 px, B ~59 mm): d ~48 px a 0,5 m. Al cambiar
                            # de resolución, recalcular con stereo.num_disparities_for
    min_disparity: 0
    block_size: 9           # px, impar (11-13 con P2 alto desbordan el costo de SGBM)
    p1_factor: 8            # P1 = 8 * 3 canales * block_size²
    p2_factor: 64           # P2 = 64 * 3 canales * block_size²
    mode: sgbm_3way         # sgbm | sgbm_3way | hh
    uniqueness_ratio: 15    # B1/B2, %
    speckle_window: 100     # B1/B2, px
    speckle_range: 2        # B1/B2, px
    lr_max_diff_px: 2.0     # B1, px
    wls_lambda: 4000.0      # B2 (4000-16000 da lo mismo en val)
    wls_sigma: 1.5          # B2
    wls_min_confidence: 16.0   # B2, escala 0-255 del mapa de confianza
  # Monocular preentrenada y congelada (src/visionx/depth/mono.py). Necesita --extra ml y bajar
  # los pesos una vez: `python -m visionx.depth bajar-mono`. Solo Small (Apache 2.0).
  mono:
    repo: depth-anything/Depth-Anything-V2-Small-hf
    revision: 5426e4f0f36572d16453bbda7a8389317b1bef99   # commit fijo del repo de pesos
    weights_sha256: 3152477ce0d8d6978d76b995120de97cb5b928701fd0f817769f59e249a16b70
    device: auto              # auto | mps | cuda | cpu
  # Alineación d ≈ s·m + t con anclas estéreo (src/visionx/depth/align.py). CONGELADOS el 14/11
  # con InStereo2K val (1080x860). Los umbrales en px dependen de la resolución: en la ELP a
  # 1280x720 la disparidad es menor y 4 px pesa más; revisarlo en el banco ELP (T04).
  alineacion:
    grid_cols: 8
    grid_rows: 6
    min_anchors_per_cell: 20
    min_grid_coverage: 0.25         # fracción de celdas con anclas
    holdout_fraction: 0.2           # celdas reservadas para comprobar el ajuste
    max_fit_anchors: 5000
    ransac_iterations: 200
    inlier_threshold_px: 4.0        # meseta desde 4 px en val
    min_inlier_ratio: 0.5           # 0,2-0,5 empatan (±0,02 puntos): el más exigente
    min_holdout_inlier_ratio: 0.3
    min_disparity_spread_px: 2.0    # P95 - P5 de las anclas
    seed: 0
  b4:
    estereo: B2               # anclas y estéreo de B3/B4: B2 ganó a B1 en val (72,0 contra 68,8 de acierto-2)
  # B5 (T12, src/visionx/depth/hybrid.py y align.local_affine): control fijo sin aprendizaje. Estéreo
  # de depth.b4.estereo donde es válido; en los huecos, monocular con una recta global más una
  # corrección afín local desde las anclas. Hereda depth.alineacion salvo `method` y lo que redefina
  # `alineacion` acá. Ajustado el 16/11 en InStereo2K val, ver BITACORA (grilla de 24 por acierto-2,
  # `python -m visionx.depth.fusion ajustar-b5`): val 76,40 % contra 71,96 % de B4; el orden de los 3
  # mejores se mantiene en 100 pares de train.
  b5:
    method: ransac            # recta global: ransac (la de B4) | huber. Huber baja la EPE pero rechaza
                              # la recta en 5/102 pares de val (RANSAC en 2): menos cobertura y acierto-2
    sigma_px: 120.0           # σ de la ventana gaussiana, px (120 > 180 > 240 en val y en train)
    slope_lambda_px2: 100.0   # λ: ata la pendiente local a la global, px² del monocular alineado
    exclude_px: 0.0           # anclas a menos de esto de un hueco no se usan (16 baja la EPE, no el acierto-2)
    samples_per_sigma: 8.0    # grilla reducida para las sumas: paso = σ / esto (no ajustado)
    min_density: 1.0e-4       # bajo esta fracción de anclas en la ventana queda la recta global (no ajustado)
    max_slope_ratio: 2.0      # pendiente local en [global/2, global·2] (no ajustado)
    alineacion: {}            # overrides de depth.alineacion solo para B5 (vacío = hereda todo)
  evaluacion:
    # Rango de búsqueda por dataset, en px (redondeado a múltiplo de 16). Sale de lo que publica
    # cada dataset, no de un número único: con 96 fijo, SGBM no puede ver la mitad de la escena.
    rango_busqueda:
      middeval3: calib      # ndisp de calib.txt por escena (120-380 px en H)
      eth3d: 64             # calib.txt trae ndisp = ancho (relleno); máx. GT de T04: 61,3 px
      instereo2k: 272       # README y auditoría T04: disparidad 20-265 px
      midd2021: calib       # dev de otro dominio (17/11): ndisp de calib.txt, 100-380 px a 1920x1080
      midd2014extra: calib  # dev de otro dominio (17/11): ndisp de calib.txt ya reducido a H
  # SpatialDepth-Fusion (T12, src/visionx/depth/fusion/). U-Net residual que corrige B4 y estima
  # incertidumbre b (Laplace). Entrenamiento: configs/fusion-entrenamiento.yaml y
  # `python -m visionx.depth.fusion`. Los canales son parte del modelo: cambiarlos invalida pesos.
  fusion:
    variante: F1              # F0 (10 canales) | F1 (+ valid_mono, 11 canales)
    canales:                  # ChannelParams (channels.py); viajan dentro del checkpoint/paquete
      error_gain: 32.0        # ganancia de error L/R y estéreo-monocular, en unidades d/W_ref
      lr_cap: 1.0             # tope del error L/R (y valor donde no se puede calcular)
      gradient_gain: 0.25     # Sobel 3x3 del gris/255 por esta ganancia, tope 1
    paquete: ""               # carpeta de un paquete (outputs/fusion/paquetes/<nombre>); vacío = sin Fusion
    cache_root: data/cache/fusion   # ingredientes por muestra (estéreo, monocular, alineación); fuera de Git
  # CREStereo adaptable (T12 desde el 18/11, src/visionx/depth/crestereo_adapt/). CREStereo
  # preentrenado y CONGELADO: no se le cambia ningún peso. Código y pesos se bajan una vez con
  # `scripts/profundidad/descargar_crestereo.py`; quedan fuera de Git (el port no tiene licencia).
  crestereo:
    port_dir: third_party/crestereo
    port_commit: b6c7a9fe8dc2e9e56ba7b96f4677312309282d15   # ibaiGorordo/CREStereo-Pytorch
    weights: weights/crestereo/crestereo_eth3d.pth
    weights_sha256: 2271ab615015a73edd4759b0f7b25a4d82ffb654270b92d3811237da3d63aa6d
    device: auto              # auto | mps | cuda | cpu
    max_disp: 256             # el que usa el script de prueba del port; no cambia los pesos
    incertidumbre: ""         # checkpoint de la U-Net de incertidumbre (mejor.pt); vacío = sin b
    # Dos modos. Valores PROVISORIOS hasta cerrar la tabla de latencia M9 (compuerta de T12).
    continuo:                 # cuadro a cuadro: buscar y guiar
      compute: [640, 360]     # por ojo; adentro se rellena a múltiplos de 16 y se recorta
      iters: 4
      passes: 2               # 1: una pasada | 2: media resolución y después completa. Solo pesa
                              # en los cuadros en frío, y ahí cuesta lo mismo que una pasada
      warm_start: true        # parte de la disparidad del cuadro anterior
      warm_reset_every: 30    # cada tantos cuadros vuelve a arrancar en frío
    preciso:                  # a pedido, sobre un par congelado: distancia
      compute: [1280, 720]
      iters: 4                # 4 con dos pasadas mide como 10 en cinta-s7 y tarda menos de la mitad
      passes: 2
      warm_start: false
      warm_reset_every: 0

detection:
  # yolo26s + 960 px (BITACORA T09 mejoras): en clips ELP detecta la taza blanca a 1 m y el bolso
  # a 3 m en 100 % de los frames (yolo26n a 640: 2 % y 0 %) y la mochila en mano en 36 % (2 %).
  # Cuesta ~0,5 s/frame en la CPU de Windows; en la Mac (MPS) falta medirlo (M1). Para una
  # máquina lenta, pisar en configs/local.yaml con yolo26n-seg e imgsz 640.
  model: yolo26s-seg        # yolo26s-seg | yolo26n-seg | yolo11n-seg; comparar con `python -m visionx.detection medir`
  weights_dir: weights      # carpeta local, ignorada por Git; `python -m visionx.detection descargar` deja ahí el .pt
  device: cpu               # cpu | mps (Mac) | cuda:0 | auto
  imgsz: 960                # lado mayor de la imagen que entra a la red, px (la salida vuelve a la resolución original)
  conf: 0.25                # score mínimo para informar un objeto, en [0, 1]; candidato, falta fijarlo con clips anotados
  iou: 0.7                  # solapamiento del NMS (YOLO26 no usa NMS y lo ignora)
  threads: null             # hilos de torch en CPU; null = lo que elige Ultralytics (núcleos lógicos - 1)
  track: true               # IDs temporales con ByteTrack
  tracker: bytetrack.yaml   # config de Ultralytics; su búfer de pérdida está en frames, no en segundos
  classes: null             # lista de clases del modelo a conservar (ej. [cup, bottle]); null = todas

# Ubicación por objeto PROVISORIA (app/spatial.py) hasta que A entregue depth/spatial (T09/T13).
# Z = percentil front_percentile de la capa más cercana de la máscara. Candidatos medidos en
# clips de desarrollo, sin calibrar; ver BITACORA T09.
spatial_provisional:
  usar: false              # true = ubicación provisoria de B en vez de la de A (spatial), para comparar
  min_valid: 0.5            # fracción mínima de la máscara con profundidad para decir metros
  layer_min_frac: 0.25      # una capa de profundidad cuenta como objeto con al menos esto de la máscara
  front_percentile: 20      # percentil de Z dentro de la capa: la superficie del frente
  max_rel_spread: 0.5       # IQR de la capa / Z; más que esto es una capa difusa: solo dirección
  spread_allowance_m: 0.4   # ...salvo que la IQR no pase esto (m): profundidad propia de un objeto (silla de cerca)
  border_px: 2              # caja a esta distancia del borde lateral: objeto cortado, reencuadrar

# Ubicación por objeto de A (src/visionx/depth/spatial/, `build_locator`; T09, política calibrada:
# T13). Z = percentil del frente de la capa más cercana de la máscara, medida en disparidad
# efectiva d + doffs y pasada a metros con la geometría. Valores elegidos con clips de DESARROLLO
# de una sola sesión (dev-1114-distancias y acercarse-1, BITACORA T09 parte A): n chico, no son
# la calibración; la definitiva sale del banco ELP (T04/T13). spatial_provisional queda para el
# ubicador provisorio de B hasta que la app cambie.
spatial:
  min_valid: 0.5            # fracción mínima de la máscara con profundidad para decir metros
  min_valid_px: 30          # y píxeles válidos mínimos en el interior (grilla de depth.compute); red
                            # de seguridad para objetos diminutos, no se activó en los clips (mín. 850)
  layer_min_frac: 0.25      # una capa cuenta como objeto con al menos esto de los píxeles válidos
  layer_bin_rel: 0.03       # ancho relativo de los intervalos de capa (3 % en d = 3 % en Z)
  layer_bin_min_px: 0.0     # piso del ancho en px de disparidad; 0,25-0,5 no cambian nada en los
                            # clips y 1,0 baja los metros de la silla en B4/B5 de ~96 % a ~70 %
  layer_floor: 0.01         # un intervalo con menos que esto de los píxeles separa capas
  front_percentile: 20      # percentil de Z en la capa = superficie del frente (p50 aleja 0,3-17 cm)
  max_rel_spread: 0.5       # IQR de la capa / Z; más que esto es una capa difusa: solo dirección
  spread_allowance_m: 0.4   # ...salvo que la IQR no pase esto (m): profundidad propia de un objeto
  erode_frac: 0.0           # interior adaptativo: erosión = esta fracción del radio inscripto. Apagado:
                            # 0,2-0,5 no mejoran el error contra cinta y en la silla alejan el frente
                            # 2-12 cm y suben el temblor cuadro a cuadro ~35 %
  erode_max_px: 6.0         # tope de la erosión, px de la grilla de profundidad (si erode_frac > 0)
  min_interior_px: 50       # si la erosión deja menos que esto, se usa la máscara entera
  border_px: 2              # caja a esta distancia del borde lateral: objeto cortado, reencuadrar
  reframe_bottom: false     # reencuadrar también si se corta abajo y el frente llega al borde. En
                            # acercarse-1 se activaría en 18 de 20 frames con la silla a <= 0,52 m
                            # (al llegar) y la frase del modo dice "girá hacia ese lado": queda apagado
  bottom_band_px: 2         # franja inferior (px de la grilla de profundidad) para esa regla

# Modos buscar y distancia (T09, src/visionx/modes/). Candidatos sin medir: M1/M7/M8 los fijan.
# El rango que se anuncia en metros: modes.range_m (si falta, depth.range_m).
modes:
  range_m: [0.5, 5.0]       # metros que se dicen; 3–5 m aproximados (abajo). Candidato: 3–5 m sin cinta
  approx_from_m: 3.0        # desde acá «a unos 4,5 metros» (error ~Z²; bolso a 3 m: 3,05 ± 0,08 con B0)
  approx_round_m: 0.5       # redondeo del tramo aproximado
  center_deg: 8.0           # |ángulo| <= esto: "al frente" (grados; + a la derecha)
  side_deg: 25.0            # <= esto: "un poco a la izquierda/derecha"; más: "a la izquierda"
  vertical_deg: 15.0        # |ángulo vertical| > esto: se agrega "arriba"/"abajo" (respecto de la cámara)
  hysteresis_deg: 3.0       # margen para cambiar de zona (izq./frente/abajo): no alternar en un límite
  confirm_hits: 2           # presencia: frames con el objeto...
  confirm_s: 1.0            # ...dentro de esta ventana, s (en tiempo, no en frames)
  max_age_s: 1.0            # observación más vieja que esto no guía, s
  max_measure_age_s: 3.0    # Z más viejo que esto no se dice, s (la profundidad tarda más)
  gate_deg: 15.0            # salto de ángulo aceptado para seguir al mismo objetivo...
  gate_deg_per_s: 60.0      # ...más esto por segundo sin verlo (la cámara gira)
  reassociate_gate_deg: 35.0 # con varios iguales: límite de salto tras pérdida, grados
  match_margin_deg: 5.0     # ventaja mínima en posición/continuidad; sin ella pide aclarar
  target_memory_s: 60.0     # s desde buscar/ver/medir: «está/eso» refiere a ese objetivo
  choice_repeat_s: 12.0     # s mínimos entre «¿Cuál?», también al perder/reasociar
  lost_s: 2.5               # sin ver el objetivo durante esto: "Perdí ...", s (clips buscar: menos avisos falsos)
  min_interval_s: 1.2       # mínimo entre dos frases de guía, s
  repeat_s: 4.0             # repetir la dirección aunque no cambie, s
  preempt_min_s: 0.6        # dirección nueva mientras suena la vieja: se corta y se dice la nueva
                            # (0,4 en la demo buscar-a del 19/11: cortes cada 0,4 s al barrer)
  short_guide: true         # después de la primera frase, sin el nombre: «Un poco a la izquierda.»
  distance_change_m: 0.3    # guía: metros nuevos se dicen solos si cambian al menos esto...
  distance_change_frac: 0.15 # ...o esta fracción (lo mayor); sin cambio no se repite la frase
  speech_base_s: 0.3        # duración estimada de una frase: base...
  speech_s_per_char: 0.065  # ...más esto por carácter (Piper es_AR: 50–70 ms/car); la guía no habla encima
  end_margin_s: 1.0         # frase de cierre antes del vencimiento de la orden, s
  round_m: 0.1              # redondeo de los metros que se dicen
  arrive_m: 0.6             # al frente y a esto o menos: "Llegaste", m
  accept_before_s: 0.5      # distancia: frame medido hasta esto ANTES de la orden, s
  max_listed: 3             # a lo sumo cuántos iguales se enumeran

# OCR beta T10. Pesos aparte: `python -m visionx.reading descargar`. Siempre CPU.
reading:
  pre_s: 0.8                # s antes de la orden; la persona apunta y después habla
  window_s: 0.4             # s máximos tras la orden; elegir la izquierda de mayor nitidez
  early_sharpness: 90.0     # varianza Laplaciano absoluta (0 desactiva); piloto ELP rectificada 1920x1080
  # Piloto ELP (7 segmentos completos): CER medio 90,95 % rectificada / 93,56 % original.
  # Remap puede deformar texto en otras lentes: conservar ambas rutas y volver a comparar.
  image_source: rectified  # original | rectified; `evaluar --imagen ambas`, mismo tamaño por ojo
  min_score: 0.65           # [0,1], descartar reconocimiento inseguro; candidato de desarrollo
  speech_min_score: 0.90    # solo voz: piloto de 7 segmentos; no modifica métricas OCR
  line_height_ratio: 0.5   # centros de renglón a <= esta fracción de la menor altura se agrupan
  region_gap_ratio: 0.15   # corredor vacío mínimo / altura mediana; sellos vecinos tienen poco margen
  section_gap_ratio: 1.5   # separación vertical amplia / altura mediana: encabezado antes de columnas
  max_age_s: 1.0           # s; no seleccionar una captura que llegó vieja al modo
  border_px: 8.0          # px de la imagen OCR: sugerir reencuadre si una caja toca el borde
  small_text_px: 20.0     # px de altura mediana: sugerir acercar solo si hay cajas pequeñas
  max_chars: 160          # caracteres por Say; acota síntesis y permite cancelar entre bloques
  speech_max_blocks: 6    # regiones habladas: unir sus renglones; título primero, luego orden visual
  speech_max_chars: 320   # total, incluido «…y más texto chico.» si hay corte; sin diálogo
  speech_base_s: 0.3      # estimación de duración para espaciar bloques, s...
  speech_s_per_char: 0.065 # ...más s/carácter, Piper es_AR (T09); falta audio real en Mac
  weights_dir: weights/rapidocr # modelos latinos PP-OCRv5; hashes fijados en reading/rapid.py
  threads: 4              # hilos ONNX CPU; dejar núcleos para captura y demás modelos
  det_limit_px: 1280       # lado mayor del detector OCR, px; conservar detalle en etiquetas
  # Piloto CPU, 7 segmentos completos: recall macro center 10,39 %, none 9,34 %, text 9,95 %.
  # Center prioriza cobertura con costo cercano a none; text baja ms pero pierde texto de Ashwa.
  # Ganancia pequeña: mismo recall micro que none, sin aciertos numéricos. Validar otros envases/Mac.
  crop: center            # none | center | text | object; candidato de desarrollo, central 60 %
  center_fraction: 0.6     # fracción del ancho Y alto conservada, centrada; luego escala a det_limit_px
  crop_margin: 0.15        # margen por lado / tamaño de envolvente de texto u objeto; limita al cuadro
  text_probe_px: 640       # primera pasada solo detección a baja resolución; segunda det+rec a 1280
  # object usa la detección más central del MISMO frame/geometría; sin ella aplica text.

# Descripción local de una escena (T11). Sin VLM ni conexión a internet.
describe:
  # Prioridad (recortar de 4 hacia 1, sin acelerar la voz):
  # 1. Metros del afirmado más cercano de la escena; de cada zona mientras alcance.
  # 2. Nombres afirmados por relevancia (cercanía, persona/área, índice estable).
  # 3. Metros del resto de afirmados. 4. Los «parece haber».
  # Los representantes de zona se retiran después de los otros nombres; el global nunca.
  # Si se recortan nombres (también por max_objects), cerrar con «y N cosas más».
  # Un override menor al hecho global mínimo con conteo conserva metros aunque se exceda.
  max_objects: 8
  # R3: desarrollo, 39 frames / 247 candidatos revisados (197 con respaldo, 50 sin él).
  # Curva y etiquetas: outputs/t11/ronda3/. No probabilidades ni test independiente.
  min_score: 0.6            # afirmación: score actual Y previo >= este corte (y el de su clase)
  cautious_score: 0.27     # reserva: "parece haber"; nunca metros; no cambia detection/buscar
  cautious_min_scores:     # pisos por clase, tanto en frame actual como en confirmaciones
    bed: 0.35             # ropa confundida con cama: score persistente <= 0.320
    bench: 0.35           # estructura/mesa de jardín: persistente <= 0.287
    banana: 0.4           # peluche: persistente <= 0.372
    potted plant: 0.4     # almohadón: persistente <= 0.395
    laptop: 0.5           # estructura de jardín: persistente <= 0.452, aislado hasta 0.770
    dining table: 0.5     # banquito: persistente <= 0.463
    oven: 0.65            # lavarropas: hasta 0.642 en contexto; no relajar por ser grande/fijo
  # Pileta/heladera usan 0.27: no hay falsos revisados; no eximirlas de persistencia.
  # No hay evidencia para bajar más cama/sillón/inodoro. Dos frames a 0.60: 99 reales/0 falsos;
  # corte global 0.40: 139/8. Con pisos + 0.27: 163/8 (4.68 %); 0.26: 164/10 (5.75 %).
  # Se elige 0.27 por máximo de reales en la grilla con <=5 % sin respaldo, antes del presupuesto.
  persist_hits: 2          # frames distintos en CADA nivel; una instancia no confirma otra
  persist_s: 3.0           # ventana de presencia antes del frame descrito (segundos)
  max_speech_s: 8.0        # presupuesto estimado con modes.speech_s_per_char; reduce el listado
  wait_measure_s: 4.0       # s; permite segunda observación en ir_lavadero (~3.3 s con estas latencias)
  large_area_fraction: 0.1  # fracción de imagen ocupada por la caja; desempata relevancia sin inferir tamaño real

camera_status:
  # Estado global de la cámara que manda el estimador (T12 CREStereo adaptable, acordado con Bauty
  # el 18/11): DepthResult UNMEASURABLE con reason "<código>" o "<código>: detalle". La app dice la
  # frase una vez si el estado dura hold_s, la recuerda cada repeat_s (0 = nunca) y avisa al volver.
  frases:
    alineando: Estoy ajustando la cámara. Esperá un momento para pedirme distancias.
    camara-desconocida: No reconozco esta cámara. Puedo decirte dónde están las cosas, pero no a cuántos metros.
    no-medible: Ahora no puedo medir distancias con esta cámara.
  lista: Listo, ya puedo medir distancias.
  hold_s: 1.0
  repeat_s: 60.0

calibration:
  board: charuco
  squares: [11, 8]
  square_m: 0.030           # reemplazar por la medida real con regla
  marker_m: 0.022
  dictionary: DICT_5X5_100

audio:
  speech_rate: 1.0          # velocidad de la voz; 1.0 = la de la voz de Piper, >1 más rápido
  input_device: null        # micrófono (índice o nombre de `python -m visionx.voice dispositivos`); null = el del sistema
  output_device: null       # parlantes/auriculares; null = los del sistema
  block_ms: 20              # bloque de reproducción, ms: demora máxima de un cancelar antes del búfer del dispositivo
  max_record_s: 8           # tope de una orden con el botón, s
  deadlines_s:              # vigencia de cada orden, s; vencida, su respuesta ya no se dice (candidatos, sin medir)
    search: 30
    distance: 10            # respuesta con dos instancias ~5 s de habla + medir (arranque en frío ~2 s) + margen
    read: 30
    describe: 20
    choose: 10
    control: 2
  tts:
    engine: edge              # edge (voz neuronal, NECESITA INTERNET; sin red sigue con Piper) | piper (local)
    edge_voice: es-UY-MateoNeural  # elegida por Tomás el 18/11 (muestras en outputs/voz/voces-naturales)
    fallback: none            # none = solo Mateo (pedido de Tomás 19/11); piper = respaldo local
    edge_timeout_s: 4.0       # tiempo base para bajar una frase...
    edge_timeout_per_char_s: 0.04  # ...más esto por carácter (respuestas largas del asistente)
    edge_attempts: 2          # intentos por frase; si fallan todos, la frase se saltea
    edge_retry_s: 30.0        # con fallback piper: tras una falla, todo por Piper este lapso
    cache_dir: data/cache/voz # frases ya dichas por Edge (sirven sin red); null = sin caché en disco
    voice: es_ES-davefx-medium  # voz de Piper (v1.0.0): única con engine piper, respaldo con edge
    voices_dir: weights/piper
    preload: ["No entendí.", "Cancelado.", "Leo.", "Describo.", "Mido la distancia."]
  stt:
    model: small            # faster-whisper: tiny | base | small | medium; comparar con `bucle`
    models_dir: weights/whisper
    device: cpu             # cpu | cuda (CTranslate2 no tiene backend MPS)
    compute_type: int8      # int8 en CPU; float16 en CUDA
    beam_size: 1            # 1 = greedy, lo más rápido; subir solo si mejora las frases medidas
    initial_prompt: "Buscá la taza. ¿A qué distancia está? Leé. Describí. Cancelar."  # orienta vocabulario y puntuación

assistant:
  # Claude con imagen para leer, describir y preguntas libres (T10/T11, decidido el 18/11 tras
  # comparar Opus/Sonnet/Haiku en 20 casos: outputs/vlm/comparativa.html). Necesita internet,
  # el extra `ia` y la key propia en ~/.visionx/anthropic_api_key (nunca ANTHROPIC_API_KEY: la
  # usarían también Claude Code y otros programas); sin eso cada modo usa su versión local.
  enabled: true
  model: claude-sonnet-5-5   # primera palabra ~0,9 s (mediana) con effort low en la comparación
  effort: low
  max_tokens: 1024
  image_width: 1280          # se reduce el ojo izquierdo a este ancho (~1.200 tokens por imagen)
  jpeg_quality: 85
  timeout_s: 15.0
  memory_s: 120.0            # preguntas de seguimiento: recuerda lo hablado durante esto
  max_turns: 6
  fallbacks: true            # fallback del servidor si el modelo rechaza una consulta
  ledger: outputs/vlm/gasto.jsonl  # costo de cada consulta
  budget_usd: 5.0            # con lo anotado en ledger >= esto, no consulta más (0 = sin tope)

proximity:
  # Alerta de cercanía (T20, app/proximity.py): obstáculo en la zona central a menos de near_m,
  # sin contar el piso (altura estimada con la cámara nivelada a camera_height_m), sostenido
  # hold_s con profundidad fresca. Callada en leer/buscar/distancia. No es navegación validada.
  # Apagada por defecto (19/11): con B0 en los clips dio ~1,7 avisos/min en la recorrida por la
  # casa, varios falsos (pared lisa, contraluz, techo) y avisos justo después de «Llegaste».
  # Probarla en vivo con CREStereo: `proximity: {enabled: true}` en configs/local.yaml.
  enabled: false
  near_m: 0.8
  zone_x: [0.3, 0.7]        # columnas centrales (fracción del ancho)
  zone_y: [0.15, 0.75]      # filas; las de abajo suelen ser piso
  camera_height_m: 1.3      # cámara a la altura del pecho
  floor_margin_m: 0.3       # lo que está a menos de esto del piso no es obstáculo
  min_fraction: 0.25        # de la zona válida
  min_px: 200
  min_coverage: 0.3         # zona casi sin píxeles válidos (pared lisa): SGBM inventa cercanía
  ceiling_m: 0.5            # más de esto por encima del eje óptico es techo
  quiet_after_s: 5.0        # callada después de que termina una orden
  hold_s: 0.4
  max_age_s: 0.8            # profundidad más vieja: alerta suspendida
  cooldown_s: 6.0
  silent_modes: [read, search, distance]
  phrase: Cuidado, algo muy cerca adelante.
