# Entrenamiento de SpatialDepth-Fusion (T12): `uv run --extra ml python -m visionx.depth.fusion entrenar`.
# Aprende con InStereo2K train y elige el checkpoint con InStereo2K val (EPE media por muestra,
# frames completos, soporte = GT ∩ B4). El test público no aparece acá.
# SGBM, alineación, monocular y canales salen de configs/default.yaml (sección depth): se copian
# al config.yaml del run para que la base B4 quede registrada junto a los pesos.
# Las claves son los nombres de TrainConfig (src/visionx/depth/fusion/train.py).

variant: F1                 # F0 (10 canales) | F1 (+ valid_mono); igual que depth.fusion.variante

model:                      # ModelConfig (model.py); in_channels sale de la variante
  widths: [32, 64, 128, 192]  # canales por nivel de la U-Net (~2 M parámetros)
  norm: batch               # group | batch | none. GroupNorm normaliza con las estadísticas de
                            # cada imagen: la salida depende de toda la entrada, y recorte (train)
                            # y frame completo (val, app) no dan lo mismo. BatchNorm en eval() y
                            # "none" son locales. Ver model.py y BITACORA T12
  norm_groups: 8            # grupos de GroupNorm (solo con norm: group)
  residual_scale: 0.0078125 # 1/128: una unidad de salida de la red = W_ref/128 px (~8 px a 1080)
  b_floor: 0.001            # piso de b en unidades de red
  b_init: 0.25              # b inicial en unidades de red (~2 px con W_ref ~1080)

loss: nll                   # nll (Laplace: |d−gt|/b + log 2b, en px) | l1 (ablación sin b)
l1_weight: 0.0              # L1 extra sumado a la NLL (0 = solo NLL)

crop: [320, 1080]           # alto, ancho del recorte en px. Ancho completo de InStereo2K: con 448 al
                            # azar, la franja izquierda (x < 160, 27-34 % del error de B4) se veía
                            # 5-9 veces menos que el centro (diagnóstico del 16/11, BITACORA)
crops_per_image: 2          # recortes por imagen decodificada: amortiza PNG + caché + canales
batch_images: 4             # imágenes por paso => 8 recortes por paso
min_valid_fraction: 0.1     # recorte con menos máscara (GT ∩ B4) se reintenta (hasta 20 veces)

epochs: 20                  # ~280 pasos por época con 1119 imágenes => ~5600 pasos
lr: 1.0e-3                  # AdamW; pico tras el warmup
weight_decay: 1.0e-4
warmup_steps: 100           # warmup lineal (nunca más de 1/5 de los pasos totales)
min_lr_ratio: 0.02          # el coseno baja hasta lr * 0,02
grad_clip: 1.0              # norma máxima del gradiente: la NLL da gradientes grandes si b es chica
seed: 0

num_workers: 4              # DataLoader con spawn (macOS). M2 Max, 16/11: 0 -> 9 imágenes/s,
                            # 2 -> 13, 4 -> 26, 6-8 -> 25 (sin ganancia). Con 0, los datos frenan la GPU
device: auto                # auto | mps | cuda | cpu
val_every: 1                # validar cada N épocas (y siempre en la última)

limit_train: 0              # 0 = todas; N = N repartidas (pilotos; la caché tiene que cubrirlas)
limit_val: 0

overfit:                    # prueba M5 (`python -m visionx.depth.fusion overfit`)
  images: 4                 # imágenes de train
  crops_per_image: 3        # 4 x 3 = 12 recortes fijos
  steps: 400
  lr: 1.0e-3                # Adam sin weight decay ni scheduler
  target_reduction_pct: 80.0  # M5: la EPE tiene que bajar >= 80 % respecto de B4
