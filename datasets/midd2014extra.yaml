descarga_manual: null
reglas_gt:
- disparidad en px, d = x_izq - x_der; infinito del PFM = sin GT (NaN en StereoSample)
- 'sin máscara publicada: nonoccluded = GT con |d0(x) - d1(x - d0)| <= 1 px (derivada por nosotros con
  disp1.pfm, no es la máscara oficial de MiddEval3)'
- 'metros: Z = fx * baseline / (d + doffs), baseline de calib.txt en mm -> m'
- 'media resolución (H) preparada al descargar: imágenes promedio 2x2, GT vecino más cercano x 0,5 (inválidos
  siguen inválidos), calib con StereoGeometry.resized'
notas:
- 'Las 13 escenas de 2014 con GT que no están en MiddEval3, versión -perfect (rectificación perfecta).
  MiddEval3 usa la -imperfect: el dev es algo más fácil.'
- 'Se evalúa en H (como MiddEval3-H): data/raw/midd2014extra/H/, derivado de full/ por `descargar`; los
  hashes de H dependen de la versión de OpenCV.'
- 'Escena = nombre sin el número: Sword1 y Sword2 comparten escena (Sword).'
- Sin escenas de MiddEval3 (chequeo en código). Rol dev, no test.
