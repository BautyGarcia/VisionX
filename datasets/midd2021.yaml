nombre: midd2021
rol: desarrollo (segunda validación de otro dominio, grupo dev)
fuente: https://vision.middlebury.edu/stereo/data/scenes2021/
licencia: Sin licencia declarada en la página; uso académico citando el paper
cita: Middlebury 2021 Mobile stereo datasets (Scharstein, Guan, Rouke, Zelenka); citar Scharstein et al.,
  GCPR 2014, como pide la página
descargas:
- url: https://vision.middlebury.edu/stereo/data/scenes2021/zip/all.zip
  bytes: 423330044
  sha256: 1b60af93fb33811236470c398ed705bd726f8eacb11507ac5d3b66ad8aea42bb
descarga_manual: null
reglas_gt:
- disparidad en px, d = x_izq - x_der; infinito del PFM = sin GT (NaN en StereoSample)
- 'sin máscara publicada: nonoccluded = GT con |d0(x) - d1(x - d0)| <= 1 px (derivada por nosotros con
  disp1.pfm, no es la máscara oficial de MiddEval3)'
- 'metros: Z = fx * baseline / (d + doffs), baseline de calib.txt en mm -> m'
notas:
- Resolución nativa 1920x1080 (celular), sin reducir. doffs = 0 en todos los pares.
- 'ladder1/ladder2 son verticales (1080x1920) y su calib.txt trae width/height intercambiados: el adaptador
  toma el tamaño de la imagen (focales y centros ya corresponden a la vertical).'
- '24 pares de 11 escenas: el número final es otra toma de la misma escena (chess1-3 = chess).'
- 'Sin escenas de MiddEval3. Rol dev: elige candidato antes del test, no es test.'
- 'Auditoría T04 del 17/11: NO pasa. skiboots2 y skiboots3 desalineadas (mínimo census en -0,77 y +0,86
  px, curvas marcadas) y podium1 no concluyente. No se usa para elegir nada hasta entender el corrimiento.'
particion:
  dev:
  - artroom
  - bandsaw
  - chess
  - curule
  - ladder
  - octogons
  - pendulum
  - podium
  - skates
  - skiboots
  - traproom
